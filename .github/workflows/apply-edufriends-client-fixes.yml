name: Apply EduFriends client fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch preview.html
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('preview.html')
          s = p.read_text(encoding='utf-8')

          old = """        #welcome-view.active { display: flex; }\n        \n        .register-card {"""
          new = """        #welcome-view.active { display: flex; }\n\n        /* Registro móvil: evita que la tarjeta alta quede centrada fuera de la pantalla. */\n        #welcome-view { min-height:100vh; height:auto; overflow-y:auto; padding:20px 12px 30px; align-items:flex-start; }\n        .register-card { margin:0 auto; max-height:none; }\n        @media (max-width:700px) {\n            #welcome-view { min-height:100vh; height:auto; padding:14px 10px 30px; align-items:flex-start; }\n            .register-card { width:100%; max-width:520px; padding:22px 16px 28px; margin:0 auto; }\n            .form-group input, .form-group select { min-height:50px; font-size:16px; }\n            .form-group label { font-size:.9rem; }\n        }\n        \n        .register-card {"""
          if old not in s:
              raise SystemExit('No se encontró el bloque CSS de welcome-view.')
          s = s.replace(old, new, 1)

          marker = """        </div>\n    </div>\n\n    <script>\n        const cursosList = ["""
          ranking = """        </div>\n\n        <!-- VISTA 6: RANKING ONLINE -->\n        <div id=\"ranking-view\" class=\"view\">\n            <button onclick=\"cambiarVista('courses-view')\" class=\"btn-main\" style=\"width:auto; padding:10px 20px; margin-bottom:20px; background:#e2e8f0; color:var(--text-main); font-weight:600;\">\n                <i class=\"fa-solid fa-arrow-left\"></i> Volver a Cursos\n            </button>\n            <div class=\"server-card\">\n                <h3 style=\"font-size:1.5rem;font-weight:800;margin-bottom:8px;\">🏆 Ranking EduFriends</h3>\n                <p style=\"color:var(--text-muted);margin-bottom:16px;\">Compara tus respuestas correctas con otros estudiantes.</p>\n                <div class=\"ranking-filters\">\n                    <select id=\"ranking-course\" onchange=\"cargarRanking()\" style=\"flex:1;min-width:220px;padding:12px;border:2px solid var(--border);border-radius:12px;background:#f8fafc;font-size:16px;\"></select>\n                </div>\n                <div id=\"ranking-status\" class=\"online-status\">Selecciona un curso para cargar el ranking.</div>\n            </div>\n            <div id=\"ranking-container\" class=\"ranking-table-wrap\">\n                <div style=\"padding:25px;text-align:center;color:var(--text-muted);\">Cargando ranking...</div>\n            </div>\n        </div>\n    </div>\n\n    <script>\n        const cursosList = ["""
          if marker not in s:
              raise SystemExit('No se encontró el punto de inserción del ranking.')
          s = s.replace(marker, ranking, 1)

          old = """        function verificarSesion() {\n            const dataGuardada = almacenamientoWeb.getItem('eduFriendsGlobalV5');\n\n            if (dataGuardada) {"""
          new = """        const EDUFRIENDS_SESSION_KEY = 'eduFriendsSessionActiveV1';\n\n        function marcarSesionActiva() {\n            almacenamientoWeb.setItem(EDUFRIENDS_SESSION_KEY, 'true');\n        }\n\n        function verificarSesion() {\n            const dataGuardada = almacenamientoWeb.getItem('eduFriendsGlobalV5');\n            const sesionActiva = almacenamientoWeb.getItem(EDUFRIENDS_SESSION_KEY);\n\n            if (dataGuardada && sesionActiva !== 'false') {"""
          if old not in s:
              raise SystemExit('No se encontró verificarSesion().')
          s = s.replace(old, new, 1)

          old = """            inicializarEconomia();\n            guardarUsuario();\n\n            // Si hay credenciales"""
          new = """            inicializarEconomia();\n            marcarSesionActiva();\n            guardarUsuario();\n\n            // Si hay credenciales"""
          if old not in s:
              raise SystemExit('No se encontró inicio de sesión local.')
          s = s.replace(old, new, 1)

          old = """                usuarioActivo.serverUsername=data.profile.username;\n                usuarioActivo.serverToken=data.token;\n                inicializarEconomia();"""
          new = """                usuarioActivo.serverUsername=data.profile.username;\n                usuarioActivo.serverToken=data.token;\n                marcarSesionActiva();\n                inicializarEconomia();"""
          if old not in s:
              raise SystemExit('No se encontró login online.')
          s = s.replace(old, new, 1)

          old = """                usuarioActivo = datos;\n                usuarioActivo.progresoCursos = usuarioActivo.progresoCursos || {};"""
          new = """                usuarioActivo = datos;\n                marcarSesionActiva();\n                usuarioActivo.progresoCursos = usuarioActivo.progresoCursos || {};"""
          if old not in s:
              raise SystemExit('No se encontró restauración de App Inventor.')
          s = s.replace(old, new, 1)

          start = s.index('        function borrarCuentaCompleta() {')
          end = s.index('\n        function cerrarSesion()', start)
          replacement = """        async function borrarCuentaCompleta() {\n            const confirmado = confirm(\n                \"¿Seguro que quieres BORRAR toda tu cuenta, progreso, XP, monedas y registros?\\n\\n\" +\n                \"Si tienes una cuenta online, también se eliminará del servidor y del ranking. Esta acción no se puede deshacer.\"\n            );\n            if (!confirmado) return;\n\n            const token = usuarioActivo?.serverToken || '';\n            if (token && servidorConfigurado()) {\n                try {\n                    await apiEduFriends('/api/me', {\n                        method: 'DELETE',\n                        headers: { Authorization: 'Bearer ' + token }\n                    });\n                } catch (e) {\n                    alert('No se pudo eliminar la cuenta online: ' + e.message + '\\n\\nNo se borrará la copia local para evitar perder tus datos.');\n                    return;\n                }\n            }\n\n            almacenamientoWeb.removeItem('eduFriendsGlobalV5');\n            almacenamientoWeb.removeItem(EDUFRIENDS_SESSION_KEY);\n            usuarioActivo = null;\n            window.datosSesionAnterior = null;\n            cursoActualSeleccionado = '';\n            nivelActualSeleccionado = 'basico';\n            indicePreguntaActual = 0;\n\n            document.getElementById('main-container').style.display = 'none';\n            document.getElementById('welcome-view').classList.add('active');\n            const form = document.getElementById('registerForm');\n            if (form) form.reset();\n            personajeSeleccionado = document.querySelector('.character-option.selected')?.getAttribute('data-avatar') || personajeSeleccionado;\n            actualizarEstadoServidor('Servidor: configurado ✓', true);\n            alert('Cuenta y todos sus datos borrados correctamente. Puedes crear una cuenta nueva.');\n        }\n"""
          s = s[:start] + replacement + s[end:]

          start = s.index('        function cerrarSesion() {')
          end = s.index('\n        function inicializarEconomia()', start)
          replacement = """        function cerrarSesion() {\n            if (!confirm(\"¿Quieres cerrar sesión? Tu información y progreso se conservarán para la próxima vez.\")) return;\n\n            if (usuarioActivo) guardarUsuario();\n            almacenamientoWeb.setItem(EDUFRIENDS_SESSION_KEY, 'false');\n            usuarioActivo = null;\n\n            document.getElementById('main-container').style.display = 'none';\n            document.getElementById('welcome-view').classList.add('active');\n\n            const datos = almacenamientoWeb.getItem('eduFriendsGlobalV5');\n            if (datos) {\n                try {\n                    const u = JSON.parse(datos);\n                    document.getElementById('reg-name').value = u.nombre || '';\n                    document.getElementById('reg-age').value = u.edad || '';\n                    document.getElementById('reg-sex').value = u.sexo || '';\n                    const ru = document.getElementById('reg-username');\n                    if (ru) ru.value = u.serverUsername || '';\n                    personajeSeleccionado = u.avatar || personajeSeleccionado;\n                } catch (e) {}\n            }\n        }\n"""
          s = s[:start] + replacement + s[end:]

          start = s.index('        async function cargarRanking() {')
          end = s.index('\n        function guardarUsuario()', start)
          replacement = """        async function cargarRanking() {\n            if (!servidorConfigurado()) return;\n            const curso = document.getElementById('ranking-course')?.value || cursosList[0].nombre;\n            const status = document.getElementById('ranking-status');\n            const container = document.getElementById('ranking-container');\n            if (!container) return;\n            if (status) status.innerText = 'Cargando ranking...';\n            try {\n                const data = await apiEduFriends('/api/rankings?course=' + encodeURIComponent(curso));\n                const rows = Array.isArray(data.ranking) ? data.ranking : [];\n                if (!rows.length) {\n                    container.innerHTML = '<div style=\"padding:25px;text-align:center;color:var(--text-muted);\">Todavía no hay jugadores en este curso.</div>';\n                } else {\n                    container.innerHTML = `<table class=\"ranking-table\"><thead><tr><th>#</th><th>Estudiante</th><th>Correctas</th><th>Respondidas</th><th>XP</th><th>Nivel</th></tr></thead><tbody>${rows.map(r => {\n                        const avatar = String(r.avatar || '').replace(/\"/g, '&quot;');\n                        const nombre = String(r.nombre || r.username || 'Usuario').replace(/[<>&]/g, '');\n                        return `<tr><td class=\"rank-medal\">${r.posicion <= 3 ? ['🥇','🥈','🥉'][r.posicion-1] : r.posicion}</td><td>${avatar ? `<img class=\"ranking-avatar\" src=\"${avatar}\" onerror=\"this.style.display='none'\">` : ''}<strong>${nombre}</strong></td><td>${Number(r.correctas)||0}</td><td>${Number(r.respondidas)||0}</td><td>${Number(r.xp)||0}</td><td>${Number(r.nivel)||1}</td></tr>`;\n                    }).join('')}</tbody></table>`;\n                }\n                if (status) status.innerText = `Ranking de ${curso} • ${rows.length} jugador(es)`;\n            } catch (e) {\n                container.innerHTML = `<div style=\"padding:25px;text-align:center;color:var(--danger);\">No se pudo cargar el ranking: ${String(e.message || e).replace(/[<>&]/g,'')}</div>`;\n                if (status) status.innerText = 'Error al cargar el ranking';\n            }\n        }\n"""
          s = s[:start] + replacement + s[end:]

          p.write_text(s, encoding='utf-8')
          print('Patched preview.html:', len(s), 'bytes')
          PY

      - name: Commit fixes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-edufriends-client-fixes.yml
          git add preview.html
          git commit -m "Fix mobile registration, ranking, logout and account deletion"
          git push
